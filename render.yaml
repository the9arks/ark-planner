services:
  - type: web
    name: ark-planner-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUTF8
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: BOT_USERNAME
        value: ARKPlannerBot
      - key: PLATEGA_MERCHANT_ID
        sync: false
      - key: PLATEGA_SECRET_KEY
        sync: false
      - key: REQUIRED_CHANNEL_ID
        sync: false
      - key: REQUIRED_CHANNEL_URL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        value: "1027565844"

  - type: web
    name: ark-planner-miniapp
    runtime: static
    rootDir: miniapp
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
